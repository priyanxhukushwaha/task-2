<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <nav class="navbar" aria-label="Main navigation">
            <a class="brand" href="#home">NOVA<span>.</span></a>

            <input class="menu-toggle" type="checkbox" id="menu-toggle">
            <label class="menu-button" for="menu-toggle" aria-label="Toggle navigation menu">
                <span></span>
                <span></span>
                <span></span>
            </label>

            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#services">Services</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>

            <a class="nav-cta" href="#contact">Get started</a>
        </nav>
    </header>

    <main>
        <section class="hero" id="home">
            <div class="hero-copy">
                <p class="hero-kicker"><span></span> Independent design studio</p>
                <h1>Make your <em>mark.</em></h1>
                <p class="hero-text">We shape bold digital experiences for brands ready to move culture forward.</p>
                <div class="hero-actions">
                    <a class="hero-primary" href="#contact">Start a project <span>↗</span></a>
                    <a class="hero-secondary" href="#services">Explore our work</a>
                </div>
                <div class="hero-meta">
                    <div><strong>14</strong><span>Global awards</span></div>
                    <div><strong>32</strong><span>Brands launched</span></div>
                </div>
            </div>
            <div class="hero-art" aria-hidden="true">
                <div class="hero-orbit hero-orbit-one"></div>
                <div class="hero-orbit hero-orbit-two"></div>
                <div class="hero-sphere"><span>N</span></div>
                <p class="hero-art-label">Ideas<br><strong>in motion</strong></p>
                <span class="hero-star hero-star-one">✦</span>
                <span class="hero-star hero-star-two">✦</span>
            </div>
        </section>
    </main>
</body>
</html>
